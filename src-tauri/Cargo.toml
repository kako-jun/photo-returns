[package]
name = "photo-returns"
version = "0.1.0"
description = "PhotoReturns: Take back your memories"
authors = ["kako-jun"]
edition = "2021"
default-run = "photo-returns"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photo_returns_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# y4m2d2からのコア機能用依存関係
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"  # タイムゾーン対応
kamadak-exif = "0.6"
image = "0.24"
thiserror = "1.0"
walkdir = "2.4"  # ディレクトリ走査用
rayon = "1.8"    # 並列処理
log = "0.4"      # ログ機能
tracing = "0.1"  # より高度なログ
tracing-subscriber = "0.3"  # ログ設定
regex = "1.10"   # 正規表現（連続撮影検出等）
mp4 = "0.14"     # MP4/QuickTimeメタデータ読み取り
img-parts = "0.3"  # JPEG/PNGメタデータ書き換え
turbojpeg = "1.4.0"

[dev-dependencies]
# e2e 統合テスト（tests/）が写真フィクスチャを生成・検証するため
image = "0.24"
img-parts = "0.3"
kamadak-exif = "0.6"  # 回転後に EXIF（Orientation 以外）が保全されることの検証用

