name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            nasm

      # turbojpeg-sys は同梱 libjpeg-turbo(>=3.0) を cmake で vendor ビルドする（SIMD に nasm 必須）。
      # cmake は各 runner に既存。macOS/Windows にも nasm を入れて vendor ビルドを成立させる。
      - name: Install nasm (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install nasm

      - name: Install nasm (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install nasm -y
        shell: pwsh

      # NOTE(#7): macOS は aarch64+x86_64 ユニバーサルのため、x86_64 スライスの vendor ビルド
      # （クロス）は未検証。Windows も choco nasm の PATH 反映を含め未検証。次回リリースで
      # 各 OS の成果物を実機確認すること（Linux は本 CI と同じ nasm vendor 経路で確認済み）。

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'PhotoReturns ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            PhotoReturns - Take back your memories

            ## What's Changed
            See the commit history for detailed changes.

            ## Installation
            - **Windows**: Download and run the `.msi` or `.exe` installer
            - **macOS**: Download the `.dmg` file, open it, and drag PhotoReturns to Applications
            - **Linux**: Download the `.AppImage`, make it executable (`chmod +x`), and run it

            ## Notes
            - macOS: You may need to right-click and select "Open" the first time due to Gatekeeper
            - Linux: You may need to install system dependencies (libwebkit2gtk-4.1)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
