name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            libturbojpeg0-dev
          # turbojpeg を vendor ビルドせず apt の libturbojpeg を pkg-config で使う（ubuntu のみ）
          echo "TURBOJPEG_SOURCE=pkg-config" >> "$GITHUB_ENV"

      # NOTE(#7): macOS（aarch64+x86_64 ユニバーサル）と Windows の turbojpeg(libjpeg-turbo)
      # native ビルドは未設定。macOS は brew jpeg-turbo が keg-only かつ x86_64 クロスで
      # arch 不一致、Windows は nasm+cmake の vendor ビルドが要る。実機リリースで検証して
      # から設定する（フォローアップ）。Linux リリースは上記 dep で動く。

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'PhotoReturns ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            PhotoReturns - Take back your memories

            ## What's Changed
            See the commit history for detailed changes.

            ## Installation
            - **Windows**: Download and run the `.msi` or `.exe` installer
            - **macOS**: Download the `.dmg` file, open it, and drag PhotoReturns to Applications
            - **Linux**: Download the `.AppImage`, make it executable (`chmod +x`), and run it

            ## Notes
            - macOS: You may need to right-click and select "Open" the first time due to Gatekeeper
            - Linux: You may need to install system dependencies (libwebkit2gtk-4.1)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
